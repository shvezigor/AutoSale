services:
  cloudflared:
    profiles: ["production-edge"]

  proxy:
    restart: "no"
    ports: !override
      - "127.0.0.1:${ACCEPTANCE_PORT:-18080}:80"

  web:
    restart: "no"

  api:
    restart: "no"

  worker:
    restart: "no"

  postgres:
    restart: "no"

  redis:
    restart: "no"

  minio:
    restart: "no"
