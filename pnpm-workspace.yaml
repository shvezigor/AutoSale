packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

overrides:
  '@grpc/grpc-js': 1.14.5
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.8
  js-yaml: 5.4.1
  multer: 2.4.0
  mysql2: 3.23.1
  qs: 6.16.0
  sharp: 0.35.4
  uuid: 11.1.1

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - protobufjs
allowBuilds:
  '@scarf/scarf': false
  '@prisma/engines': true
  argon2: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@grpc/grpc-js@1.14.5'
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - next@16.3.6
  - '@prisma/adapter-pg@7.10.0'
  - '@prisma/client-runtime-utils@7.10.0'
  - '@prisma/client@7.10.0'
  - '@prisma/config@7.10.0'
  - '@prisma/debug@7.10.0'
  - '@prisma/driver-adapter-utils@7.10.0'
  - '@prisma/engines@7.10.0'
  - '@prisma/fetch-engine@7.10.0'
  - '@prisma/get-platform@7.10.0'
  - prisma@7.10.0
  - '@aws-sdk/client-s3@3.1118.0'
